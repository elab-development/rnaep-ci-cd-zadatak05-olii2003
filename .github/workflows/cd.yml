name: CD - Build & Push Docker Image

on:
  push:
    branches:
      - develop
      - main

jobs:

  unit-tests:
    name: Unit Tests (CD Guard)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesi Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        working-directory: payment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Pokreni unit testove
        working-directory: payment
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: |
          python -m pytest tests/test_unit.py -v --tb=short

  integration-tests:
    name: Integration Tests (CD Guard)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesi Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        working-directory: payment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Pokreni integracione testove
        working-directory: payment
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: |
          python -m pytest tests/test_integration.py -v --tb=short

  functional-tests:
    name: Functional Tests (CD Guard)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesi Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        working-directory: payment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Pokreni funkcionalne testove
        working-directory: payment
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: |
          python -m pytest tests/test_functional.py -v --tb=short


  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    
    needs:
      - unit-tests
      - integration-tests
      - functional-tests

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Odredi Docker tag na osnovu grane
        id: docker-tag
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=develop" >> $GITHUB_OUTPUT
          fi

      - name: Prijavi se na DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Podesi Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build i push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./payment
          file: ./payment/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ steps.docker-tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
