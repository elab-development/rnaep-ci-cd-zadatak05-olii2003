name: CI - Payment Service Tests

# Pokreće se pri svakom push-u na bilo koju granu
on:
  push:
    branches:
      - '**'

jobs:

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesi Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        working-directory: payment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Pokreni unit testove
        working-directory: payment
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: |
          python -m pytest tests/test_unit.py -v --tb=short


  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesi Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        working-directory: payment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Pokreni integracione testove
        working-directory: payment
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: |
          python -m pytest tests/test_integration.py -v --tb=short


  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesi Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj zavisnosti
        working-directory: payment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Pokreni funkcionalne testove
        working-directory: payment
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: |
          python -m pytest tests/test_functional.py -v --tb=short
